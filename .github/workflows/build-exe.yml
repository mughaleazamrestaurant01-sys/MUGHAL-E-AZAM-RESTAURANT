name: Build Portable Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller requests

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Mughal-E-Azam-POS" --add-data "index.html;." --add-data "assets;assets" app.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mughal-E-Azam-POS-Windows
          path: dist/Mughal-E-Azam-POS.exe
