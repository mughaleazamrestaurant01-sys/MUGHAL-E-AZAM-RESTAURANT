<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Receipts - Classic Monospace POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/receipt-designs.css">
</head>
<body>
    <div class="page-header">
        <h1>Mughal-E-Azam POS — Thermal Receipt Design Reference</h1>
        <p>Preview of 80mm Mono POS Layouts for Printers & Drivers</p>
    </div>

    <div class="receipt-grid">
        <div id="templates-1-container"></div>
        <div id="templates-2-container"></div>
    </div>

    <script>
        async function loadReceiptTemplates() {
            const t1 = await (await fetch('assets/html/receipt-templates-1.html')).text();
            const t2 = await (await fetch('assets/html/receipt-templates-2.html')).text();
            document.getElementById('templates-1-container').innerHTML = t1;
            document.getElementById('templates-2-container').innerHTML = t2;
        }
        loadReceiptTemplates();
    </script>
</body>
</html>
