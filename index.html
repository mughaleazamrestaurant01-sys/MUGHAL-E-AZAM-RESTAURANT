<!DOCTYPE html>
<html lang="en" class="h-full bg-[#18191d]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUGHAL-E-AZAM - Restaurant</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
    <link rel="shortcut icon" href="assets/images/favicon.ico">
    <!-- Tailwind CSS & FontAwesome -->
    <script src="assets/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="assets/css/fontawesome.all.min.css">
    <link rel="stylesheet" href="assets/css/fonts-cinzel.css">
    <link rel="stylesheet" href="assets/css/fonts-inter.css">
    <link rel="stylesheet" href="assets/css/pos-custom.css">
    <!-- Vue 3 CDN -->
    <script src="assets/js/vue.global.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neu: {
                            bg: '#1e2026', dark: '#141519', light: '#282b33',
                            accent: '#ff4d5a', accentHover: '#ff3344',
                            text: '#e1e7ed', muted: '#7b8392',
                            emerald: '#10b981', amber: '#f59e0b',
                            blue: '#3b82f6', purple: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        royal: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full text-neu-text antialiased selection:bg-neu-accent selection:text-white font-sans overflow-hidden">

    <div id="app" class="h-full flex flex-col bg-[#16171b]">

        <!-- Boot Loader Screen -->
        <div v-if="!bootReady" class="fixed inset-0 bg-[#141519] z-[60] flex items-center justify-center p-4">
            <div class="neu-flat rounded-3xl p-8 text-center border border-[#252730]">
                <i class="fa-solid fa-database animate-pulse text-3xl text-neu-accent mb-3"></i>
                <p class="text-sm font-bold text-white">{{ bootError || 'Preparing secure POS…' }}</p>
                <p class="text-xs text-neu-muted mt-2">{{ bootError ? 'The data service is unavailable. Check connection and try again.' : 'Please wait while POS connects.' }}</p>
                <button v-if="bootError" @click="startBoot" class="mt-4 px-4 py-2 bg-neu-accent text-white text-xs font-bold rounded-xl">Try again</button>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div v-if="toastMessage" class="fixed bottom-5 right-5 z-[70] max-w-sm rounded-2xl border border-emerald-400/40 bg-[#20242b] px-4 py-3 text-sm font-semibold text-white shadow-xl" role="status" aria-live="polite">
            {{ toastMessage }}
        </div>

        <!-- HTML Partials Containers -->
        <div id="auth-screen-container"></div>
        <div id="nav-header-container"></div>

        <!-- Main View Container -->
        <main class="flex-1 overflow-hidden relative">
            <div id="terminal-view-container" class="h-full"></div>
            <div id="menu-management-container" class="h-full"></div>
            <div id="inventory-records-container" class="h-full"></div>
            <div id="admin-view-container" class="h-full"></div>
        </main>

        <!-- Modals Containers -->
        <div id="modals-checkout-printer-container"></div>
        <div id="modals-system-user-container"></div>
    </div>

    <!-- JS Logic Modules -->
    <script src="assets/js/pos-bridge.js"></script>
    <script src="assets/js/pos-data.js"></script>
    <script src="assets/js/pos-methods-core.js"></script>
    <script src="assets/js/pos-methods-admin.js"></script>
    <script src="assets/js/pos-methods-print.js"></script>

    <!-- Load HTML Partials Synchronously before Vue mount -->
    <script>
        async function loadPartials() {
            const partials = [
                ['#auth-screen-container', 'assets/html/auth-screen.html'],
                ['#nav-header-container', 'assets/html/nav-header.html'],
                ['#terminal-view-container', 'assets/html/terminal-view.html'],
                ['#menu-management-container', 'assets/html/menu-management-view.html'],
                ['#inventory-records-container', 'assets/html/inventory-records-kds-views.html'],
                ['#admin-view-container', 'assets/html/admin-view-1.html'],
                ['#modals-checkout-printer-container', 'assets/html/modals-checkout-printer.html'],
                ['#modals-system-user-container', 'assets/html/modals-system-user.html']
            ];
            for (const [selector, path] of partials) {
                const res = await fetch(path);
                const html = await res.text();
                const el = document.querySelector(selector);
                if (el) el.innerHTML = html;
            }
        }
        loadPartials().then(() => {
            const appScript = document.createElement('script');
            appScript.src = 'assets/js/pos-app.js';
            document.body.appendChild(appScript);
        });
    </script>
</body>
</html>
