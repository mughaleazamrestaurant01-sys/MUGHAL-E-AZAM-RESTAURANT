        <!-- Modal: Backup & Restore -->
        <div v-if="showBackupModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="neu-flat w-full max-w-md rounded-3xl p-6 border border-[#282a35] space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-[#262832]">
                    <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-database text-purple-400 mr-2"></i>Database Backup & Restore</h3>
                    <button @click="showBackupModal = false" class="text-neu-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="space-y-3 text-xs">
                    <div>
                        <label class="text-neu-muted block mb-1 font-semibold">Backup Target Directory</label>
                        <div class="flex gap-2">
                            <input type="text" :value="backupDirectory || 'Not configured'" readonly class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                            <button @click="selectBackupFolder" class="px-3 py-2 bg-purple-600 text-white font-bold rounded-xl whitespace-nowrap">Choose</button>
                        </div>
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button @click="createBackupNow" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl">Backup Now</button>
                        <button @click="restoreBackup" class="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl">Restore Backup</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal: Add / Rename Table -->
        <div v-if="showTableModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="neu-flat w-full max-w-xs rounded-3xl p-6 border border-[#282a35] space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-[#262832]">
                    <h3 class="font-bold text-white text-sm">{{ editingTableId ? 'Rename Table' : 'Add New Table' }}</h3>
                    <button @click="showTableModal = false" class="text-neu-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form @submit.prevent="saveTable" class="space-y-3 text-xs">
                    <div>
                        <label class="text-neu-muted block mb-1">Table Name / Number</label>
                        <input type="text" v-model="tableForm.name" placeholder="e.g. Table 7" required class="w-full neu-input p-3 rounded-xl text-white outline-none">
                    </div>
                    <button type="submit" class="w-full py-3 bg-neu-accent text-white font-bold rounded-xl neu-accent-glow">Save Table</button>
                </form>
            </div>
        </div>

        <!-- Edit Dish / Menu Item Modal -->
        <div v-if="showEditDishModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="neu-flat w-full max-w-md rounded-3xl p-6 border border-[#282a35] space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-[#262832]">
                    <h3 class="font-bold text-white text-sm">{{ editingDish ? 'Edit Menu Dish' : 'Create New Menu Dish' }}</h3>
                    <button @click="showEditDishModal = false" class="text-neu-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <form @submit.prevent="saveDish" class="space-y-3 text-xs">
                    <div>
                        <label class="text-neu-muted block mb-1">Dish Name</label>
                        <input type="text" v-model="dishForm.name" required class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-neu-muted block mb-1">Category</label>
                        <select v-model="dishForm.categoryId" class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                            <option v-for="cat in categories" :key="cat.id" :value="cat.id">{{ cat.name }}</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-neu-muted block mb-1">Price (Rs.)</label>
                        <input type="number" v-model.number="dishForm.price" required class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="isAvailable" v-model="dishForm.isAvailable" class="rounded">
                        <label for="isAvailable" class="text-white font-semibold">Available in POS</label>
                    </div>
                    <button type="submit" class="w-full py-3 bg-neu-accent text-white font-bold rounded-xl neu-accent-glow mt-2">Save Dish</button>
                </form>
            </div>
        </div>

        <!-- Edit Category Modal -->
        <div v-if="showEditCategoryModal && editingCategory" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="neu-flat w-full max-w-xs rounded-3xl p-6 border border-[#282a35] space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-[#262832]">
                    <h3 class="font-bold text-white text-sm">Edit Category</h3>
                    <button @click="showEditCategoryModal = false" class="text-neu-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form @submit.prevent="updateCategory" class="space-y-3 text-xs">
                    <div>
                        <label class="text-neu-muted block mb-1">Category Name</label>
                        <input type="text" v-model="editingCategory.name" required class="w-full neu-input p-3 rounded-xl text-white outline-none">
                    </div>
                    <button type="submit" class="w-full py-3 bg-neu-accent text-white font-bold rounded-xl neu-accent-glow">Update Category</button>
                </form>
            </div>
        </div>

        <!-- Modal: Add / Edit User -->
        <div v-if="showAdminPanelModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="neu-flat w-full max-w-md rounded-3xl p-6 border border-[#282a35] space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-[#262832]">
                    <h3 class="font-bold text-white text-sm">{{ userForm.id ? 'Edit User Profile' : 'Create New User Account' }}</h3>
                    <button @click="showAdminPanelModal = false" class="text-neu-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <form @submit.prevent="saveUser" class="space-y-3 text-xs">
                    <div>
                        <label class="text-neu-muted block mb-1">Full Name</label>
                        <input type="text" v-model="userForm.name" required class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-neu-muted block mb-1">Username</label>
                        <input type="text" v-model="userForm.username" required class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-neu-muted block mb-1">Password {{ userForm.id ? '(Leave empty to keep current)' : '' }}</label>
                        <input type="password" v-model="userForm.password" :required="!userForm.id" class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-neu-muted block mb-1">Role</label>
                        <select v-model="userForm.role" class="w-full neu-input p-2.5 rounded-xl text-white outline-none">
                            <option value="Cashier">Cashier</option>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full py-3 bg-neu-accent text-white font-bold rounded-xl neu-accent-glow mt-2">Save User Account</button>
                </form>
            </div>
        </div>

        <!-- Modal: Add Expense -->
        <div v-if="showAddExpenseModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="neu-flat w-full max-w-sm rounded-3xl p-6 border border-[#282a35]">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-[#262832]">
                    <h3 class="font-bold text-white text-sm">Log Expense</h3>
                    <button @click="showAddExpenseModal = false" class="text-neu-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <form @submit.prevent="saveExpense" class="space-y-3 text-xs">
                    <div>
                        <label class="text-neu-muted block mb-1">Expense Title</label>
                        <input type="text" v-model="newExpenseForm.title" placeholder="e.g. Utility Bills" required class="w-full neu-input p-3 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-neu-muted block mb-1">Amount (Rs.)</label>
                        <input type="number" v-model.number="newExpenseForm.amount" required class="w-full neu-input p-3 rounded-xl text-white outline-none">
                    </div>
                    <button type="submit" class="w-full py-3 bg-neu-accent text-white font-bold rounded-xl neu-accent-glow mt-2">Record Expense</button>
                </form>
            </div>
        </div>
