        <!-- Dedicated Menu & Category Management Tab -->
        <div v-show="currentTab === 'menu' && hasPermission('menu')" class="h-full flex flex-col p-6 overflow-y-auto space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="font-royal text-2xl font-bold text-white tracking-wide">MENU & CATEGORY MANAGEMENT</h2>
                    <p class="text-xs text-neu-muted">Manage Dishes, Prices, Categories & Item Status</p>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="openAddDishModal" class="px-4 py-2.5 bg-neu-accent text-white text-xs font-bold rounded-xl neu-accent-glow flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add New Dish
                    </button>
                </div>
            </div>

            <!-- Active Menu Items List Table -->
            <div class="neu-card rounded-2xl p-6 border border-white/5 space-y-4">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-white">
                        <thead class="text-[10px] uppercase text-neu-muted border-b border-white/10">
                            <tr>
                                <th class="pb-3">Dish Name</th>
                                <th class="pb-3">Category</th>
                                <th class="pb-3">Price</th>
                                <th class="pb-3">Status</th>
                                <th class="pb-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/5">
                            <tr v-for="dish in menuItems" :key="dish.id" class="hover:bg-white/5">
                                <td class="py-3 font-semibold">{{ dish.name }}</td>
                                <td class="py-3 text-neu-muted">{{ getCategoryName(dish.categoryId) }}</td>
                                <td class="py-3 font-bold text-emerald-400">Rs. {{ dish.price }}</td>
                                <td class="py-3">
                                    <button @click="toggleDishAvailability(dish)" :class="[dish.isAvailable ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400']" class="px-2.5 py-1 rounded-full text-[10px] font-bold">
                                        {{ dish.isAvailable ? 'Available' : 'Out of Stock' }}
                                    </button>
                                </td>
                                <td class="py-3 text-right space-x-2">
                                    <button @click="openEditDishModal(dish)" class="text-blue-400 hover:text-blue-300 font-bold">Edit</button>
                                    <button @click="deleteDish(dish.id)" class="text-neu-accent hover:text-red-400 font-bold">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
